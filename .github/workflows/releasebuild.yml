on:
  push:
    #branches:
    #  - 'main'
    tags:
      - 'v*'
  pull_request:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - auth-service
          - edge-service
          - search-service
          - transfer-service

    permissions:
      # for tagging
      contents: write
      # for pushing container images
      packages: write
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: asraf344
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3    
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Run GoReleaser
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get commit information
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"  
      
      - name: Sign the images with GitHub OIDC Token
        env:
          IMAGE: ghcr.io/asraf344/axiler/${{ matrix.image }}:${{ steps.commit.outputs.short_sha }}
        run: |
          cosign sign --yes "${IMAGE}"  
                    
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/asraf344/axiler/${{ matrix.image }}:${{ steps.commit.outputs.short_sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'    
      -
        name: Clear
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          rm -f ${HOME}/.docker/config.json