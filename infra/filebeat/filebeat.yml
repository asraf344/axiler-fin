filebeat.inputs:

  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
output.elasticsearch:
  hosts:
    - "http://elasticsearch:9200"

setup.kibana:
  host: "http://kibana:5601"