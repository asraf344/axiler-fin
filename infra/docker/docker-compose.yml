version: '3.9'

services:
  # Vault for secrets management
  vault:
    image: vault:latest
    container_name: fintech-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintech

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: fintech-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fintech
    depends_on:
      - edge
      - auth
      - search
      - transfer

  # Elasticsearch for logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: fintech-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - fintech
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: fintech-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - fintech
    depends_on:
      - elasticsearch

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fintech-jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
    networks:
      - fintech

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: fintech-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./infra/monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    networks:
      - fintech
    depends_on:
      - prometheus

  # Security Edge (API Gateway)
  edge:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.edge
    container_name: fintech-edge
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=debug
    networks:
      - fintech
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      vault:
        condition: service_healthy

  # Auth Service
  auth:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.auth
    container_name: fintech-auth
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - LOG_LEVEL=debug
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-token
    networks:
      - fintech
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      vault:
        condition: service_healthy

  # Search Service
  search:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.search
    container_name: fintech-search
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - LOG_LEVEL=debug
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-token
    networks:
      - fintech
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      vault:
        condition: service_healthy

  # Transfer Service (with 3 replicas for redundancy demo)
  transfer:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.transfer
    container_name: fintech-transfer
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - LOG_LEVEL=debug
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-token
    networks:
      - fintech
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1 # For local dev; Swarm would use 3
    depends_on:
      vault:
        condition: service_healthy

networks:
  fintech:
    driver: bridge

volumes:
  prometheus_data:
  elasticsearch_data:
  grafana_data:
